}

/* Primitives ----------------------------------------------------------------- */

.dot.green { background: var(--green); } .dot.orange { background: var(--orange); } .dot.red { background: var(--red); } .dot.blue { background: var(--blue); } .dot.purple { background: var(--purple); }

.acc { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 4px 24px; }
.acc > details > summary { font-size: 15px; }

.src { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }

/* Home ----------------------------------------------------------------------- */

/* Wizard --------------------------------------------------------------------- */

.q h2 { font-size: 27px; margin-bottom: 6px; letter-spacing: -0.028em; font-weight: 700; }
.q .help { color: var(--text-2); margin-bottom: 20px; font-size: 15px; }

.opt:hover { border-color: var(--line-2); box-shadow: var(--shadow-2); transform: translateY(-1px); }
.opt.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

.opt .l { font-weight: 500; } .opt .d { display: block; color: var(--text-3); font-size: 12.5px; font-weight: 400; margin-top: 2px; }
.opts.compact .opt { padding: 10px 12px; border-radius: 13px; } .opts.compact { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
